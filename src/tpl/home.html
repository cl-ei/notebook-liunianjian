<!DOCTYPE html>
<html lang="zh-CN" x-data="notebookApp()" x-cloak>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流年笺</title>

    <link rel="stylesheet" href="/notebook/static/font-awesome-6-4-0/css/all.min.css">
    <link rel="stylesheet" href="/notebook/static/fonts/fonts.css">
    <link rel="stylesheet" href="/notebook/static/css/highlight.min.css">
    <link rel="stylesheet" href="/notebook/static/katex-0.18.5/katex.min.css">
    <script src="/notebook/static/js/highlight.min.js"></script>
    <script src="/notebook/static/katex-0.18.5/katex.min.js"></script>
    <script src="/notebook/static/js/marked-18.0.5.js"></script>
    <script src="/notebook/static/js/diff_match_patch.js"></script>
    <script src="/notebook/static/js/spark-md5.min.js"></script>
    <script src="/notebook/static/js/purify-3.1.6.min.js"></script>
    <script src="/notebook/static/js/tailwindcss-3.4.17.js"></script>
    <script>
        /* ================================================================
           [调色板] 把 Tailwind 的颜色名映射到 CSS 变量
           —— 这是整套主题的核心：切主题只改 --c-* 变量，class 一个都不动
           —— 变量值定义在下面 <style> 里的 :root / [data-theme="dark"]
           用法：bg-surface  text-ink  border-line  bg-accent-soft ...
           ================================================================ */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* —— 表面层级（由底到顶）—— */
                        canvas:   'var(--c-canvas)',      /* 最底层背景 */
                        surface:  'var(--c-surface)',     /* 面板：nav/侧栏/弹窗/预览 */
                        surface2: 'var(--c-surface-2)',   /* 次级条：标题栏/列表底 */
                        surface3: 'var(--c-surface-3)',   /* 凹槽/禁用/代码块 */
                        editor:   'var(--c-editor)',      /* 写作区 */
                        hover:    'var(--c-hover)',       /* 悬停底色 */
                        veil:     'var(--c-veil)',        /* 面板内半透明遮罩 */
                        scrim:    'var(--c-scrim)',       /* 全屏遮罩 */

                        /* —— 线条 —— */
                        line:        'var(--c-border)',
                        'line-soft': 'var(--c-border-soft)',

                        /* —— 文字（由强到弱）—— */
                        ink:   'var(--c-text)',
                        'ink-2': 'var(--c-text-2)',
                        'ink-3': 'var(--c-text-3)',
                        'ink-4': 'var(--c-text-4)',

                        /* —— 悬停加强 / 拖拽高亮 —— */
                        'hover-strong': 'var(--c-hover-strong)',
                        'drag':         'var(--c-drag)',

                        /* —— 文件类型图标 —— */
                        'icon-folder': 'var(--c-icon-folder)',
                        'icon-md':     'var(--c-icon-md)',
                        'icon-image':  'var(--c-icon-image)',
                        'icon-code':   'var(--c-icon-code)',

                        /* —— 强调色 —— */
                        accent:         'var(--c-accent)',
                        'accent-strong': 'var(--c-accent-strong)',
                        'accent-soft':   'var(--c-accent-soft)',
                        'accent-line':   'var(--c-accent-line)',
                        danger:         'var(--c-danger)',
                        'danger-strong': 'var(--c-danger-strong)',
                        'danger-soft':   'var(--c-danger-soft)',
                        success:        'var(--c-success)',
                        'success-soft':  'var(--c-success-soft)',
                        warn:           'var(--c-warn)',
                        'warn-strong':   'var(--c-warn-strong)',
                        'warn-soft':     'var(--c-warn-soft)',
                    }
                }
            },
            /* ================================================================
               [安全清单] 只出现在 tree-browser.js 里的类名。
               Tailwind CDN 靠扫描 DOM 生成样式，而文件树是 fetch 完之后才
               x-html 塞进来的——扫描有延迟，首帧可能没样式。写死在这里，
               让它启动时就生成好。以后树里新增了颜色类名，记得同步加进来。
               ================================================================ */
            safelist: [
                'hover:bg-hover-strong', 'bg-drag',
                'text-icon-folder', 'text-icon-md', 'text-icon-image', 'text-icon-code',
                'group-hover:text-ink-3',
                'ring-line',
            ]
        }
    </script>

    <script defer src="/notebook/static/js/utils.js"></script>
    <script defer src="/notebook/static/js/tree-browser.js"></script>
    <script defer src="/notebook/static/js/alpinejs-3.x.x-cdn.min.js"></script>
    <style>
        /* ========== 全局基础 ========== */
        [x-cloak] { display: none !important; }

        /* ---- 层级（与主题无关）---- */
        :root {
            --z-nav: 30;
            --z-context-menu: 70;
            --z-normal-modal: 80;
            --z-modal: 80;
            --z-history: 85;
            --z-modal-share: 85;
            --z-overlay: 120;
            --z-toast: 130;
        }

        /* ================================================================
           [调色板 · 日间]  ——保持你现在的观感，只是把硬编码换成变量
           ================================================================ */
        :root, [data-theme="light"] {
            /* 表面 */
            --c-canvas:      #f8f9fa;
            --c-surface:     #ffffff;
            --c-surface-2:   #f8f9fa;
            --c-surface-3:   #f1f3f5;
            --c-editor:      #ffffff;
            --c-hover:       #f1f3f5;
            --c-hover-strong: #e9ecef;   /* 已聚焦行再悬停，比普通悬停深一档 */
            --c-drag:        #93c5fd;    /* 拖拽：源节点 + 悬停目标 */
            --c-veil:        rgba(255, 255, 255, .85);
            --c-scrim:       rgba(0, 0, 0, .45);

            /* 文件类型图标（文件树） */
            --c-icon-folder: #f59e0b;
            --c-icon-md:     #60a5fa;
            --c-icon-image:  #f472b6;
            --c-icon-code:   #22c55e;

            /* 线条 */
            --c-border:      #e9ecef;
            --c-border-soft: #f1f3f5;

            /* 文字 */
            --c-text:        #212529;
            --c-text-2:      #495057;
            --c-text-3:      #868e96;
            --c-text-4:      #adb5bd;

            /* 强调色 */
            --c-accent:         #3b82f6;
            --c-accent-strong:  #2563eb;
            --c-accent-soft:    #eff6ff;
            --c-accent-line:    #bfdbfe;
            --c-danger:         #ef4444;
            --c-danger-strong:  #dc2626;
            --c-danger-soft:    #fef2f2;
            --c-success:        #10b981;
            --c-success-soft:   #ecfdf5;
            --c-warn:           #f59e0b;
            --c-warn-strong:    #d97706;
            --c-warn-soft:      #fffbeb;
            --c-on-accent:      #ffffff;   /* 强调色填充之上的文字色 */

            /* 编辑器细节 */
            --c-caret:          #212529;
            --c-selection:      rgba(77, 171, 247, .25);

            /* 滚动条 */
            --c-scrollbar:       #ced4da;
            --c-scrollbar-hover: #adb5bd;
        }

        /* ================================================================
           [调色板 · 夜间护眼]  夜半听风雨，挑灯书流年

           调这里时要记住四条（暗色不是"浅色的反色"）：
           1. 底色不用纯黑——#000 配白字会产生光晕(halation)，反而更累
           2. 正文不用纯白——浅灰比 #fff 舒服得多
           3. 整体压低对比度，"降一档"才是护眼的本质
           4. editor 略亮于 surface，让"灯"照在纸上，写作区成为视觉焦点
           ================================================================ */
        [data-theme="dark"] {
            /* 表面：微暖的中性深灰，不用冷蓝黑 */
            --c-canvas:      #191a1c;
            --c-surface:     #212326;
            --c-surface-2:   #1d1f21;
            --c-surface-3:   #2b2e33;
            --c-editor:      #282b2e;   /* 比面板亮一档 */
            --c-hover:       #2f3338;
            --c-hover-strong: #3a4046;
            --c-drag:        rgba(91, 156, 248, .32);  /* 半透明比实色更贴合深底 */
            --c-veil:        rgba(33, 35, 38, .85);
            --c-scrim:       rgba(0, 0, 0, .65);   /* 暗背景下要更深才压得住 */

            /* 文件类型图标：夜间降饱和 + 提亮，避免变成一盏盏小彩灯 */
            --c-icon-folder: #dba63f;
            --c-icon-md:     #6ba7f5;
            --c-icon-image:  #e07fb0;
            --c-icon-code:   #52c47f;

            /* 线条 */
            --c-border:      #303031;
            --c-border-soft: #2b2e33;

            /* 文字 */
            --c-text:        #c9ccd1;
            --c-text-2:      #a8adb5;
            --c-text-3:      #9399a2;
            --c-text-4:      #767c85;

            /* 强调色：降饱和 + 提亮，避免夜里"闪光弹" */
            --c-accent:         #5b9cf8;
            --c-accent-strong:  #7cb0fa;
            --c-accent-soft:    rgba(91, 156, 248, .14);
            --c-accent-line:    rgba(91, 156, 248, .35);
            --c-danger:         #f07171;
            --c-danger-strong:  #f58a8a;
            --c-danger-soft:    rgba(240, 113, 113, .14);
            --c-success:        #34d399;
            --c-success-soft:   rgba(52, 211, 153, .14);
            --c-warn:           #fbbf24;
            --c-warn-strong:    #fcd34d;
            --c-warn-soft:      rgba(251, 191, 36, .14);
            --c-on-accent:      #14181e;   /* 亮色填充上必须用深色文字，否则对比度不够 */

            /* 编辑器细节 */
            --c-caret:          #e0b64a;             /* 暖黄光标，呼应"挑灯" */
            --c-selection:      rgba(224, 182, 74, .28);

            /* 滚动条 */
            --c-scrollbar:       #3a3f45;
            --c-scrollbar-hover: #4a5057;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--c-canvas);
            color: var(--c-text);
            overflow: hidden;
            height: 100vh;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-scrollbar-hover); }

        /* ========== 编辑器 ========== */
        textarea.editor, pre code {
            font-family:
                    'JetBrains Mono',
                    'Sarasa Mono SC',
                    'Noto Sans Mono CJK SC',
                    'Microsoft YaHei',
                    'PingFang SC',
                    monospace;
        }
        textarea.editor {
            font-size: 14px;
            line-height: 1.7;
            tab-size: 4;
        }

        /* ========== FM胶囊 ========== */
        .fm-capsule {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px; /* 胶囊形状 */
            font-size: 10px;
            font-weight: 600;
            color: white;
            transition: background-color 0.4s ease, box-shadow 0.4s ease; /* 关键：平滑过渡 */
            cursor: default;
            user-select: none;
        }

        /* 默认状态（代码图标，非胶囊） */
        .fm-default {
            color: var(--c-text-4);
            font-size: 10px;
        }

        /* 状态1: OK - 绿色 */
        .fm-ok {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 1px 3px rgba(34, 197, 94, 0.2);
        }

        /* 状态-1: Error - 黄色 */
        .fm-error {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            box-shadow: 0 1px 3px rgba(234, 179, 8, 0.2);
        }

        /* 移除之前的流光动画，因为我们不需要了 */
        .fm-capsule::before {
            display: none;
        }

        /* ========== 加载动画 ========== */
        .loading-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--c-surface-3);
            border-top-color: var(--c-accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 编辑器 · 主题细节 ==========
           暗色模式最容易漏的三个：光标、选区、placeholder
           光标尤其致命——不设 caret-color，它在深底上会变成黑光标，几乎看不见 */
        textarea.editor { caret-color: var(--c-caret); }
        textarea.editor::placeholder { color: var(--c-text-4); }
        textarea.editor::selection { background: var(--c-selection); color: inherit; }
        ::selection { background: var(--c-selection); }

        /* ========== FM 胶囊 · 夜间去饱和 ==========
           高饱和渐变填充在夜里就是两块刺眼的灯，改成"淡底 + 亮字" */
        [data-theme="dark"] .fm-ok {
            background: var(--c-success-soft);
            color: var(--c-success);
            box-shadow: none;
        }
        [data-theme="dark"] .fm-error {
            background: var(--c-warn-soft);
            color: var(--c-warn);
            box-shadow: none;
        }

        /* 强调色填充之上的文字：夜间把白字换成深色。
           亮绿/亮蓝填充配白字对比度不到 2:1，在夜里尤其糊。 */
        [data-theme="dark"] .text-white { color: var(--c-on-accent); }

        /* ========== 主题切换过渡 ==========
           只在切换那一瞬间挂到 <html> 上（见 applyTheme），260ms 后摘掉。
           常驻会给整个 DOM 加 transition，编辑大文件时明显拖慢响应。 */
        .theme-anim,
        .theme-anim *,
        .theme-anim *::before,
        .theme-anim *::after {
            transition: background-color .22s ease,
            border-color     .22s ease,
            color            .22s ease,
            box-shadow       .22s ease !important;
        }
    </style>

    <script>
        /* ================================================================
           [防闪烁] 必须在 body 渲染前同步执行，且不能加 defer。
           在样式生效前就把 data-theme 打到 <html> 上，
           否则夜间用户每次刷新都会先闪一下白底。
           想改默认主题：把下面的 fallback 改成 'light' 即可。
           ================================================================ */
        (function () {
            var saved = localStorage.getItem('notebook_theme');
            var theme = saved
                || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>

<!-- ============================
     [NAV] 顶部导航栏
     ============================ -->
<nav class="h-14 bg-surface border-b border-line flex items-center justify-center px-4 flex-shrink-0 shadow-sm relative z-[var(--z-nav)]">
    <div class="absolute left-4 flex items-center space-x-1">
        <a href="#" @click.prevent="navigateAway()" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-ink-2 hover:bg-hover hover:text-ink transition-all duration-150" title="返回主页">
            <i class="fas fa-home text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">主页</span>
        </a>
        <div class="h-6 w-px bg-line mx-1"></div>
        <button x-show="currentFile" @click="saveFile()" :disabled="isSaving" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-ink-2 hover:bg-hover hover:text-ink transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed" title="保存 (Ctrl+S)">
            <i class="fas fa-save text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">保存</span>
        </button>
        <button x-show="currentFile" @click="showHistory()" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-ink-2 hover:bg-hover hover:text-ink transition-all duration-150" title="历史版本">
            <i class="fas fa-history text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">历史</span>
        </button>
    </div>

    <div class="flex items-center justify-center">
        <span class="font-bold text-ink text-sm tracking-wide">流年笺</span>
    </div>

    <div class="absolute right-4 flex items-center space-x-2">
        <!-- [THEME] 日间 / 夜间护眼 -->
        <button @click="toggleTheme()"
                class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-ink-2 hover:bg-hover transition-all duration-150"
                :title="theme === 'dark' ? '切换到日间模式' : '切换到夜间护眼模式'">
            <i class="fas text-sm" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
            <span class="text-sm font-medium hidden sm:inline" x-text="theme === 'dark' ? '日间' : '夜间'"></span>
        </button>
        <div class="h-6 w-px bg-line mx-1"></div>

        <div class="flex items-center bg-surface3 rounded-lg p-0.5 ml-1">
            <button @click="viewMode = 'single'" :class="viewMode === 'single' ? 'bg-surface text-accent shadow-sm' : 'text-ink-4 hover:text-ink-2'" class="px-2.5 py-1.5 rounded-md text-xs transition-all duration-150" title="单页视图">
                <i class="fas fa-window-maximize"></i>
            </button>
            <button @click="viewMode = 'split'" :class="viewMode === 'split' ? 'bg-surface text-accent shadow-sm' : 'text-ink-4 hover:text-ink-2'" class="px-2.5 py-1.5 rounded-md text-xs transition-all duration-150" title="双页视图">
                <i class="fas fa-columns"></i>
            </button>
        </div>
        <div class="h-6 w-px bg-line mx-1"></div>
        <div class="relative">
            <button @click="userMenu = !userMenu" class="flex items-center space-x-2 px-2 py-1.5 rounded-lg hover:bg-hover transition-colors max-w-[200px]">
                <div class="w-7 h-7 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0" x-text="currentUserEmail.charAt(0).toUpperCase()"></div>
                <span class="hidden md:inline text-xs font-medium text-ink-2 truncate" x-text="currentUserEmail"></span>
            </button>
            <div x-show="userMenu" @click.away="userMenu = false" @keydown.escape="userMenu = false" x-transition class="absolute right-0 top-full mt-1.5 w-56 bg-surface rounded-xl shadow-lg border border-line-soft py-1 z-[var(--z-normal-modal)]">
                <!-- 用户信息头部（保留，符合认知） -->
                <div class="px-4 py-3 border-b border-line-soft">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 flex items-center justify-center text-white font-bold shadow-sm" x-text="currentUserEmail.charAt(0).toUpperCase()"></div>
                        <div class="min-w-0">
                            <p class="text-sm font-medium text-ink truncate" x-text="currentUserEmail"></p>
                            <p class="text-xs text-ink-3">已登录</p>
                        </div>
                    </div>
                </div>

                <button @click="openChangePwdModal()" type="button" class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-ink-2 hover:bg-accent-soft hover:text-accent transition-colors">
                    <i class="fas fa-key text-ink-4 w-4"></i>
                    <span>修改密码</span>
                </button>

                <div class="border-t border-line-soft my-1"></div>

                <button @click="logout()" type="button" class="w-full flex items-center space-x-3 px-4 py-2.5 text-sm text-danger hover:bg-danger-soft transition-colors">
                    <i class="fas fa-sign-out-alt w-4"></i>
                    <span>退出登录</span>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ============================
     [LAYOUT] 主内容区
     ============================ -->
<div class="flex" style="height: calc(100vh - 3.5rem);">
    <aside
            x-show="!sidebarCollapsed"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="-translate-x-full opacity-0"
            x-transition:enter-end="translate-x-0 opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="translate-x-0 opacity-100"
            x-transition:leave-end="-translate-x-full opacity-0"
            class="w-64 bg-surface border-r border-line flex-shrink-0 overflow-hidden flex flex-col absolute md:relative z-20 h-full"
    >
        <div class="h-11 p-4 border-b border-line-soft flex items-center justify-between bg-surface2">
            <h3 class="text-[11px] font-bold text-ink-4 uppercase tracking-wider">文件管理</h3>
        </div>
        <div x-data="treeBrowser()" class="h-full">
            <div class="overflow-auto flex-1 p-2 h-full" @click="onTreeClick" @contextmenu.prevent="onTreeRightClick" x-html="treeHtml"></div>
            <template x-teleport="body">
                <div
                        x-show="contextMenu.show"
                        x-cloak
                        @click.away="closeContextMenu()"
                        @contextmenu.prevent="closeContextMenu()"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="opacity-100 scale-100"
                        x-transition:leave-end="opacity-0 scale-95"
                        class="fixed z-[var(--z-context-menu)] min-w-[180px] bg-surface rounded-xl shadow-2xl border border-line-soft py-1 overflow-hidden"
                        :style="`left: ${contextMenu.x}px; top: ${contextMenu.y}px;`"
                >
                    <div x-show="contextMenu.targetNode" class="px-3 py-2 border-b border-line-soft bg-surface2">
                        <p class="text-xs text-ink-4 truncate" x-text="contextMenu.targetNode?.name || ''"></p>
                    </div>
                    <template x-for="(item, index) in contextMenu.items" :key="index">
                        <div>
                            <div x-show="item.divider" class="my-1 border-t border-line-soft"></div>
                            <button
                                    x-show="!item.divider"
                                    @click="executeContextAction(item.action)"

<!-- ============================
     [SCRIPT] 应用逻辑
     ============================ -->
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('notebookApp', () => ({
            currentUserEmail: localStorage.getItem('notebook_user_email') || '',
            username: '',
            domain: '',

            viewMode: 'split',
            sidebarCollapsed: false,

            // ---- [Theme] 'light' | 'dark' ----
            // 初值直接读 <html data-theme>，与 head 里的防闪烁脚本保持单一数据源
            theme: document.documentElement.getAttribute('data-theme') || 'light',
            _themeAnimTimer: null,

            currentFile: null,          // {id, base, version, baseContent, fmStatus, fmLog}
            editorContent: '',
            lastSavedContent: '',      // 脏检查锚点
            lastCommitMd5: '',         // 防重复提交
            isSaving: false,           // 保存锁

            overlay: { show: false, message: '' },

            previewReady: false,
            syncTimer: null,

            toasts: [],
            toastIdCounter: 0,

            confirmDialog: { show: false, title: '', message: '', confirmText: '确认', cancelText: '取消', type: 'danger', onConfirm: null, onCancel: null },
            promptDialog: { show: false, title: '', message: '', placeholder: '', value: '', onConfirm: null, onCancel: null },
            historyDialog: { show: false, filePath: '', historyList: [], selectedItem: null, selectedContent: null, loading: false, diffLoading: false, diffHtml: '' },
            userMenu: false,
            shareDialog: { show: false, loading: false, filepath: '', filename: '', isShared: false, shareUrl: '', error: '' },
            showChangePwdModal: false,
            changePwdForm: { oldPwd: '', newPwd: '', confirmPwd: '', showOldPwd: false, showNewPwd: false, loading: false },

            fmBubbleOpen: false, // 控制FM气泡显示

            // ============================
            // [STATE] 静态站点生成
            // ============================
            siteGenerateModalOpen: false, // 控制弹窗显示
            userSiteAccessUrl: '',
            siteGenerateLoading: false,

            init() {
                // 应用主题（instant=true：首屏不要过渡动画）
                this.applyTheme(true);
                // 主题变化时重发一次预览，让 iframe 里的 render.html 跟上配色
                this.$watch('theme', () => this._doSyncPreview());

                try {
                    const email = this.currentUserEmail;
                    const [username, domain] = email.split('@');
                    this.username = username;
                    this.domain = domain;
                } catch (e) {
                    this.showToast('用户信息有误，请重新登录', 'error');
                    return;
                }

                window.addEventListener('message', (event) => {
                    if (event.data?.type === 'IFRAME_READY') {
                        this.previewReady = true;
                    }
                });

                document.addEventListener('keydown', (e) => {
                    // Ctrl+S 保存
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        this.saveFile();
                    }
                });

                // ===== 页面卸载前检查未保存内容 =====
                window.addEventListener('beforeunload', (e) => {
                    // 脏检查
                    if (this.notebook__hasUnSavedChanges()) {
                        e.preventDefault();
                        e.returnValue = '';
                        return '';
                    }
                });

                // 监听来自 iframe 的消息
                window.addEventListener('message', (event) => {
                    // 安全校验：只处理来自我们 iframe 的消息
                    if (event.source !== this.$refs.previewFrame?.contentWindow) return;
                    if (event.data.type === 'IFRAME_CLICK') {
                        this.closeAllPopups();
                    }
                });

                // 绑定内容变更事件，触发内容同步到 iframe
                // 因为 _doSyncPreview 涉及 FM 的解析，其结果会影响 FM icon,
                // 所以任何内容变更都应调用 _doSyncPreview
                // 在 _doSyncPreview 内部对视图进行判断，处理生成逻辑和 iframe 消息的发送
                const syncPreview = () => this._doSyncPreview();
                this.$watch('viewMode', syncPreview);
                this.$watch('editorContent', syncPreview);
                this.$watch('previewReady', ready => ready && syncPreview());
                this.$watch('currentFile', (newFile, oldFile) => {
                        if (newFile?.id !== oldFile?.id) syncPreview()
                    },
                    { deep: true }
                );
                // 编辑器键盘监听
                this.$nextTick(() => {
                    const editor = this.$refs.editor;
                    if (!editor) return;
                    editor.addEventListener('keydown', (e) => { nb_editorKeydownHandler(e, { editor: editor }); });
                });
            },

            // ============================
            // [API] Export API
            // ============================
            notebook__hasUnSavedChanges() {
                return this.editorContent !== this.lastSavedContent && this.editorContent.trim() !== '';
            },
            notebook__changeFilePath(path) {
                if (this.currentFile) {
                    this.currentFile.id = path;
                } else {
                    this.currentFile = { id: path, base: null, version: null, baseContent: '' };
                }
            },
            async notebook__ensureDiscardUnSavedContent() {
                if (!this.notebook__hasUnSavedChanges()) return true;
                return await this.showConfirm({
                    title: '未保存的更改',
                    message: '当前编辑内容尚未保存，打开其他文件将丢失未保存的更改。确定要继续吗？',
                    confirmText: '放弃更改',
                    cancelText: '取消',
                    type: 'warning'
                })
            },
            async notebook__openFile(path) {
                const filename = path.replace(/\\/g, '/').split(/[?#]/)[0].split('/').pop() || '';
                this.currentFile = { id: path, base: null, version: null, baseContent: '', fmStatus: null, fmLog: null }

                if (isTextType(filename)) {
                    // ---- 文本类：调 /notebook/open 接口 ----
                    try {
                        const res = await fetch('/notebook/open', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filepath: path, version: null }),
                            credentials: 'include',
                        });
                        const resp = await res.json();
                        if (resp.code !== 0) throw new Error(resp.msg || '打开失败');

                        const { version, base, base_content, diff } = resp.data;
                        const fullContent = mergeContent(base_content, diff);

                        this.editorContent = fullContent;
                        this.lastSavedContent = fullContent;

                        // 记录版本锚点
                        this.currentFile.base = base;
                        this.currentFile.version = version;
                        this.currentFile.baseContent = base_content;
                    } catch (e) {
                        this.editorContent = `# 加载失败\n\n无法读取文件内容: ${filename}\n\n> 错误: ${e.message}`;
                        this.lastSavedContent = this.editorContent;
                        this.currentFile.base = null;
                        this.currentFile.version = null;
                        this.currentFile.baseContent = '';
                    }
                } else if (isImageType(filename)) {
                    // ---- 图片类 ----
                    this.editorContent = `![](${filename})`;
                    this.lastSavedContent = this.editorContent;
                } else {
                    // ---- 其他文件 ----
                    const encodedPath = encodeURIComponent(path);
                    this.editorContent = `<a href="/notebook/raw_file?path=${encodedPath}" target="_blank">📎 点击下载/打开文件：${filename}</a>`;
                    this.lastSavedContent = this.editorContent;
                }
            },
            async notebook__openSharePage(path) { return await this.ctxOpenShareDialog(path); },
            notebook__closeFile() {
                // 强制关闭文档
                this.currentFile = null;
                this.editorContent = '';
                this.lastSavedContent = '';
                this.lastCommitMd5 = '';
                this.isSaving = false;
                this.fmBubbleOpen = false;
            },
            async notebook__publishBlog(dirPath) { await this.openSiteGenerateModal(dirPath); },
            // ============================
            // [UI] 通用提示、对话方法
            // ============================
            closeAllPopups() {
                this.userMenu = false;
                this.fmBubbleOpen = false;
                // 通知树组件
                window.dispatchEvent(new Event('notebook:closeAllPopups'));
            },

            showOverlay(message = '正在处理...') {
                this.overlay = { show: true, message };
            },
            hideOverlay() {
                this.overlay.show = false;
            },
            showToast(message, type = 'info') {
                const id = ++this.toastIdCounter;
                this.toasts.push({ id, message, type, show: true });

                setTimeout(() => {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.show = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }, type === 'info' ? 2500 : 5000);
            },
            async showConfirm({ title, message, confirmText, cancelText, type }) {
                return new Promise((resolve) => {
                    this.confirmDialog = {
                        show: true, title: title || '确认操作', message: message || '确定要执行此操作吗？',
                        confirmText: confirmText || '确认', cancelText: cancelText || '取消', type: type || 'danger',
                        onConfirm: () => { this.confirmDialog.show = false; resolve(true); },
                        onCancel: () => { this.confirmDialog.show = false; resolve(false); }
                    };
                });
            },
            async showPrompt({ title, message, placeholder, defaultValue, icon }) {
                return new Promise((resolve) => {
                    this.promptDialog = {
                        show: true,
                        title: title || '请输入',
                        message: message || '',
                        placeholder: placeholder || '',
                        value: defaultValue || '',
                        icon: icon || 'fas fa-edit',
                        onConfirm: () => {
                            this.promptDialog.show = false;
                            resolve(this.promptDialog.value.trim());
                        },
                        onCancel: () => {
                            this.promptDialog.show = false;
                            resolve(null);
                        }
                    };
                    this.$nextTick(() => this.$refs.promptInput?.focus());
                });
            },

            // ============================
            // [Iframe] 同步内容到预览窗
            // ============================

            _doSyncPreview() {
                if (this.syncTimer) clearTimeout(this.syncTimer);
                this.syncTimer = setTimeout(() => {
                    let contentToSend = '';
                    try {
                        const filepath = this.currentFile?.id || '';
                        let pureInput = this.editorContent;

                        if (isMarkdownType(filepath)) {
                            // Markdown 文件：直接渲染
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 更新 FM 状态
                            if (this.currentFile) {
                                this.currentFile.fmStatus = rendered.status;
                                this.currentFile.fmLog = rendered.log;
                            }
                        } else if (isCodeType(filepath)) {
                            // 代码文件：包成 Markdown 代码块，复用渲染管线
                            const lang = getCodeLang(filepath);
                            // 处理代码内容里的反引号：如果内容里有连续3个反引号，用4个反引号包裹避免语法冲突
                            const fenceLen = Math.max(3, (pureInput.match(/`+/g) || []).reduce((max, m) => Math.max(max, m.length), 0) + 1);
                            const fence = '`'.repeat(fenceLen);
                            // 转义内容里的反斜杠（避免 Markdown 转义问题）
                            const escapedContent = pureInput.replace(/\\/g, '\\\\');
                            // 拼接成 Markdown 代码块
                            pureInput = `${fence}${lang}\n${escapedContent}\n${fence}`;
                            // 交给 Markdown 渲染，自动触发代码高亮
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 代码文件不需要 FM 校验
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else if (isPlainTextType(filepath)) {
                            // 纯文本文件：用原来的样式包裹
                            pureInput = `<div class="plain-text-preview">${escapeHtml(this.editorContent)}</div>`;
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else if (isImageType(filepath)) {
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else {
                            // 其他类型（图片/二进制等）：保持原有逻辑
                            contentToSend = `<div class="preview-placeholder">不支持预览的文件类型</div>`;
                        }
                    } catch (e) {
                        contentToSend = `<div class="preview-error">渲染失败: ${escapeHtml(e.message)}</div>`;
                    }

                    if (!this.previewReady) return;
                    const iframe = document.querySelector('iframe[x-ref="previewFrame"]');
                    if (!iframe?.contentWindow) {
                        console.warn('预览iframe未就绪，跳过同步');
                        return;
                    }
                    iframe.contentWindow.postMessage({
                        type: 'SYNC_CONTENT',
                        html: contentToSend,
                        path: this.currentFile?.id || '',
                        username: this.username,
                        domain: this.domain,
                        theme: this.theme,   // 供 render.html 同步配色
                    }, '*');
                }, 300);
            },
            // ============================
            // [Theme] 主题切换
            // ============================
            applyTheme(instant) {
                const root = document.documentElement;
                if (!instant) {
                    // 过渡只在切换瞬间挂上，260ms 后摘掉（常驻会拖慢大 DOM）
                    root.classList.add('theme-anim');
                    clearTimeout(this._themeAnimTimer);
                    this._themeAnimTimer = setTimeout(() => root.classList.remove('theme-anim'), 260);
                }
                root.setAttribute('data-theme', this.theme);
                localStorage.setItem('notebook_theme', this.theme);
            },
            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme();
            },

            // ============================
            // [Editor] 编辑框方法
            // ============================
            formatPath(path, maxLen = 45) {
                if (!path) return '';
                if (path.length <= maxLen) return path;
                const half = Math.floor((maxLen - 3) / 2);
                return path.substring(0, half) + '...' + path.substring(path.length - half);
            },
            copyPath() {
                if (this.currentFile?.id) {
                    navigator.clipboard.writeText(this.currentFile.id).then(() => {
                        this.showToast('路径已复制到剪贴板', 'success');
                    }).catch(() => {
                        this.showToast('复制失败', 'error');
                    });
                }
            },
            async saveFile() {
                if (!this.currentFile) return this.showToast('请先选择文件', 'error');
                if (isDirType(this.currentFile.type)) return;

                // 非文本类拦截
                if (!isTextType(this.currentFile.id)) {
                    return this.showToast('该文件类型不支持直接编辑保存', 'error');
                }

                // 检查是否有版本锚点
                if (this.currentFile.base === null || this.currentFile.base === undefined) {
                    return this.showToast('缺少版本基础信息，无法保存', 'error');
                }

                // 保存锁
                if (this.isSaving) return;

                // 计算 dist_md5
                const distMd5 = SparkMD5.hash(this.editorContent);

                // 防重复提交
                if (distMd5 === this.lastCommitMd5) {
                    this.showToast('内容未变更，无需保存', 'info');
                    return;
                }

                this.isSaving = true;

                try {
                    // 计算 diff
                    const diff = computeDiff(this.currentFile.baseContent, this.editorContent);

                    const payload = {
                        filepath: this.currentFile.id,
                        base: this.currentFile.base,
                        dst_md5: distMd5,
                        diff: diff
                    };

                    const res = await fetch('/notebook/save_file_delta', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        credentials: 'include',
                    });

                    const data = await res.json();
                    if (data.code !== 0) throw new Error(data.msg || '保存失败');

                    // 成功：更新锚点
                    this.lastSavedContent = this.editorContent;
                    this.lastCommitMd5 = distMd5;

                    // 检查服务端是否变基
                    if (data.data.base !== this.currentFile.base) {
                        this.currentFile.baseContent = this.editorContent;
                    }
                    this.currentFile.base = data.data.base;
                    this.currentFile.version = data.data.version;

                    this.showToast('保存成功！', 'success');
                } catch (e) {
                    this.showToast(e.message || '保存失败', 'error');
                } finally {
                    this.isSaving = false;
                }
            },
            closeCurrentFileAndDeselect() {
                // 1. 清空编辑框、关闭当前文件
                this.notebook__closeFile();
                window.dispatchEvent(new Event('notebook:closeFile'));
            },
            // ============================
            // [HISTORY] 文件历史相关方法
            // ============================
            showHistory() {
                if (!this.currentFile) {
                    this.showToast('请先选择文件', 'error');
                    return;
                }
                if (isDirType(this.currentFile.type)) {
                    this.showToast('目录没有历史版本', 'error');
                    return;
                }
                this.historyDialog = {
                    show: true,
                    filePath: this.currentFile.id,
                    historyList: [],
                    selectedItem: null,
                    loading: true,
                    diffLoading: false,
                    diffHtml: '<div class="text-ink-4 text-sm p-4">请在左侧选择一个版本查看差异</div>'
                };

                // 请求历史列表
                fetch('/notebook/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filepath: this.currentFile.id }),
                    credentials: 'include',
                })
                    .then(res => res.json())
                    .then(resp => {
                        if (resp.code !== 0) throw new Error(resp.msg || '获取历史失败');
                        this.historyDialog.historyList = resp.data.history || [];
                    })
                    .catch(e => {
                        this.showToast(e.message || '获取历史失败', 'error');
                        this.historyDialog.diffHtml = `<div class="text-danger text-sm p-4">加载失败: ${escapeHtml(e.message)}</div>`;
                    })
                    .finally(() => {
                        this.historyDialog.loading = false;
                    });
            },
            selectHistoryItem(item) {
                this.historyDialog.selectedItem = item;
                this.historyDialog.diffLoading = true;
                this.historyDialog.diffHtml = '<div class="flex items-center justify-center p-8"><div class="loading-spinner"></div></div>';

                const requestBody = { filepath: this.currentFile.id, version: item.version };

                fetch('/notebook/diff', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody),
                    credentials: 'include',
                })
                    .then(res => res.json())
                    .then(resp => {
                        if (resp.code !== 0) throw new Error(resp.msg || '获取差异失败');

                        const { prev_content, current_content, current_version, prev_version } = resp.data;

                        this.historyDialog.diffHtml = generateDiffHtml(prev_content || '', current_content || '');
                        this.historyDialog.selectedContent = {
                            current_content,
                            prev_content,
                            current_version,
                            prev_version
                        };
                    })
                    .catch(e => {
                        console.error('[DEBUG] diff 请求失败:', e);
                        this.historyDialog.diffHtml = `<div class="text-danger text-sm p-4">加载差异失败: ${escapeHtml(e.message)}</div>`;
                    })
                    .finally(() => {
                        this.historyDialog.diffLoading = false;
                    });
            },
            revertHistory() {
                const cached = this.historyDialog.selectedContent;
                if (!cached || !cached.current_content) {
                    this.showToast('未获取到版本内容，请先点击左侧版本加载', 'error');
                    return;
                }

                this.editorContent = cached.current_content;
                this.lastSavedContent = cached.current_content;

                this.showToast('已恢复到该版本', 'success');
                this.closeHistory();
            },
            closeHistory() {
                this.historyDialog.show = false;
            },
            // ============================
            // [Share] 分享功能
            // ============================
            async ctxOpenShareDialog(path) {
                const filename = path.replace(/\\/g, '/').split(/[?#]/)[0].split('/').pop() || '';
                this.shareDialog = {
                    show: true,
                    loading: true,
                    filepath: path,
                    filename: filename,
                    isShared: false,
                    shareUrl: '',
                    error: ''
                };

                // 构造探测 URL
                const testUrl = `/notebook/share_settings/${path.replace(/^\//, '')}`;

                try {
                    const resp = await fetch(testUrl, { method: 'GET', credentials: 'include' });
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                    const data = await resp.json();
                    if (data.code === 0) {
                        // 已开启分享
                        this.shareDialog.isShared = true;
                        this.shareDialog.shareUrl = `/notebook/share/${this.username}/${this.domain}/${path.replace(/^\//, '')}`;
                    } else {
                        // 未开启分享
                        this.shareDialog.isShared = false;
                    }
                } catch (e) {
                    this.shareDialog.error = '网络请求失败';
                } finally {
                    this.shareDialog.loading = false;
                }
            },
            async toggleShare() {
                const { filepath, isShared } = this.shareDialog;
                const method = isShared ? 'DELETE' : 'POST';

                this.shareDialog.loading = true;
                try {
                    const resp = await fetch('/notebook/share', {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filepath: filepath }),
                        credentials: 'include',
                    });
                    const data = await resp.json();
                    if (data.code === 0) {
                        if (method === 'POST') {
                            // 开启成功，后端返回 key
                            this.shareDialog.isShared = true;
                            this.shareDialog.shareUrl = data.data.key; // key 就是完整 URL Path
                            this.showToast('分享已开启', 'success');
                        } else {
                            // 关闭成功
                            this.shareDialog.isShared = false;
                            this.shareDialog.shareUrl = '';
                            this.showToast('分享已关闭', 'success');
                        }
                    } else {
                        throw new Error(resp.msg || '操作失败');
                    }
                } catch (e) {
                    this.shareDialog.show = false;
                    this.showToast('操作失败', 'error');
                } finally {
                    this.shareDialog.loading = false;
                }
            },
            copyShareLink() {
                const url = location.origin + this.shareDialog.shareUrl;
                navigator.clipboard.writeText(url).then(() => {
                    this.showToast('链接已复制到剪贴板', 'success');
                }).catch(() => {
                    this.showToast('复制失败', 'error');
                });
            },
            viewSharePage() {
                const url = location.origin + this.shareDialog.shareUrl;
                window.open(url, '_blank');
            },
            closeShareDialog() {
                this.shareDialog.show = false;
            },
            // ============================
            // [Others] 主页、登出
            // ============================
            navigateAway() {
                // 编码特殊字符，避免邮箱里有+、=等符号导致路径错误
                const url = `/notebook/publish/${encodeURIComponent(this.username)}/${encodeURIComponent(this.domain)}`;
                if (this.editorContent !== this.lastSavedContent && this.editorContent.trim() !== '') {
                    this.showConfirm({
                        title: '未保存的更改',
                        message: '当前编辑内容尚未保存，离开后将丢失更改。确定要继续吗？',
                        confirmText: '放弃更改',
                        cancelText: '取消',
                        type: 'warning'
                    }).then(confirmed => {
                        if (confirmed) window.location.href = url;
                    });
                } else {
                    window.location.href = url;
                }
            },
            async logout() {
                if (this.editorContent !== this.lastSavedContent && this.editorContent.trim() !== '') {
                    const confirmed = await this.showConfirm({
                        title: '未保存的更改',
                        message: '当前编辑内容尚未保存，退出登录将丢失未保存的更改。确定要继续吗？',
                        confirmText: '放弃更改并退出',
                        cancelText: '取消',
                        type: 'warning'
                    });
                    if (!confirmed) return;
                }

                const confirmed = await this.showConfirm({ title: '退出登录', message: '退出后需要重新登录才能访问你的笔记', confirmText: '确认退出', type: 'danger' });
                if (!confirmed) return;

                this.showOverlay('正在退出登录...');

                try {
                    const res = await fetch('/notebook/logout', { method: 'POST', credentials: 'include' });
                    const data = await res.json();
                    if (data.code !== 0) {
                        this.hideOverlay();
                        this.showToast(data.msg || '退出失败', 'error');
                    } else {
                        setTimeout(() => {
                            window.location.href = '/notebook/guest';
                        }, 1200);
                    }
                } catch (e) {
                    this.hideOverlay();
                    this.showToast('登出请求失败', 'error');
                }
            },
            // 打开修改密码弹窗
            openChangePwdModal() {
                this.userMenu = false; // 关闭下拉菜单
                this.changePwdForm = {
                    oldPwd: '',
                    newPwd: '',
                    confirmPwd: '',
                    showOldPwd: false,
                    showNewPwd: false,
                    loading: false
                };
                this.showChangePwdModal = true;
            },
            // 关闭修改密码弹窗
            closeChangePwdModal() {
                this.changePwdForm = {
                    oldPwd: '',
                    newPwd: '',
                    confirmPwd: '',
                    showOldPwd: false,
                    showNewPwd: false,
                    loading: false
                };
                this.showChangePwdModal = false;
            },
            // 提交修改密码
            async submitChangePwd() {
                // 前端二次校验
                if (this.changePwdForm.newPwd !== this.changePwdForm.confirmPwd) {
                    this.showToast('两次输入的密码不一致', 'error');
                    return;
                }
                if (this.changePwdForm.newPwd.length < 5 || this.changePwdForm.newPwd.length > 32) {
                    this.showToast('新密码长度需在5-32位之间', 'error');
                    return;
                }
                this.changePwdForm.loading = true;
                try {
                    const res = await fetch('/notebook/change_password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            old_password: this.changePwdForm.oldPwd,
                            new_password: this.changePwdForm.newPwd
                        }),
                        credentials: 'include'
                    });
                    const data = await res.json();
                    if (data.code === 0) {
                        this.showToast('密码修改成功，即将退出登录', 'success');
                        // 清除本地登录态
                        localStorage.removeItem('notebook_user_email');
                        // 1秒后跳转到未登录页
                        setTimeout(() => {
                            window.location.href = '/notebook/guest';
                        }, 1000);
                    } else {
                        this.showToast(data.msg || '密码修改失败', 'error');
                    }
                } catch (e) {
                    this.showToast('网络错误，请稍后重试', 'error');
                } finally {
                    this.changePwdForm.loading = false;
                }
            },
            // ============================
            // [UI] 博客发布相关方法
            // ============================
            // 1. 打开弹窗并获取当前版本
            async openSiteGenerateModal(dirPath) {
                // 2. 根据 node.id 拼接预览地址（核心逻辑）
                // 示例：假设基础域名是 window.location.origin
                // 假设路径规则是 /sites/{node.id}/index.html
                this.userSiteAccessUrl = '/notebook/publish/' + this.username + "/" + this.domain + "/";
                // 4. 关闭modal
                this.siteGenerateModalOpen = true;
            },
            // 2. 关闭弹窗并清理轮询
            closeSiteGenerateModal() {
                this.siteGenerateModalOpen = false;
            },
            async startSiteGeneration() {
                this.siteGenerateLoading = true;
                try {
                    const res = await fetch('/notebook/static_site', {
                        method: 'POST',
                        credentials: 'include',
                    });
                    const data = await res.json();
                    if (data.code !== 0) {
                        this.showToast(data.msg || '生成失败', 'error');
                    } else {
                        this.showToast('生成成功', 'success');
                    }
                } catch (e) {
                    this.showToast('请求失败', 'error');
                } finally {
                    this.siteGenerateLoading = false;
                    this.siteGenerateModalOpen = false;
                }
            },
        }));
    });
</script>
