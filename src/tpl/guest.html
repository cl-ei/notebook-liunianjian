<!DOCTYPE html>
<html lang="zh-CN" x-data="guestApp()" x-cloak>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流年笺 - 游客预览</title>

    <link rel="stylesheet" href="/notebook/static/font-awesome-6-4-0/css/all.min.css">
    <link rel="stylesheet" href="/notebook/static/fonts/fonts.css">
    <link rel="stylesheet" href="/notebook/static/css/highlight.min.css">
    <link rel="stylesheet" href="/notebook/static/katex-0.18.5/katex.min.css">
    <script src="/notebook/static/js/highlight.min.js"></script>
    <script src="/notebook/static/katex-0.18.5/katex.min.js"></script>
    <script src="/notebook/static/js/marked-18.0.5.js"></script>
    <script src="/notebook/static/js/diff_match_patch.js"></script>
    <script src="/notebook/static/js/spark-md5.min.js"></script>
    <script src="/notebook/static/js/purify-3.1.6.min.js"></script>
    <script src="/notebook/static/js/tailwindcss-3.4.17.js"></script>

    <script>
        /* ================================================================
           [调色板] 把 Tailwind 的颜色名映射到 CSS 变量
           —— 这是整套主题的核心：切主题只改 --c-* 变量，class 一个都不动
           —— 变量值定义在下面 <style> 里的 :root / [data-theme="dark"]
           用法：bg-surface  text-ink  border-line  bg-accent-soft ...
           ================================================================ */
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        /* —— 表面层级（由底到顶）—— */
                        canvas:   'var(--c-canvas)',      /* 最底层背景 */
                        surface:  'var(--c-surface)',     /* 面板：nav/侧栏/弹窗/预览 */
                        surface2: 'var(--c-surface-2)',   /* 次级条：标题栏/列表底 */
                        surface3: 'var(--c-surface-3)',   /* 凹槽/禁用/代码块 */
                        editor:   'var(--c-editor)',      /* 写作区 */
                        hover:    'var(--c-hover)',       /* 悬停底色 */
                        veil:     'var(--c-veil)',        /* 面板内半透明遮罩 */
                        scrim:    'var(--c-scrim)',       /* 全屏遮罩 */

                        /* —— 线条 —— */
                        line:        'var(--c-border)',
                        'line-soft': 'var(--c-border-soft)',

                        /* —— 文字（由强到弱）—— */
                        ink:   'var(--c-text)',
                        'ink-2': 'var(--c-text-2)',
                        'ink-3': 'var(--c-text-3)',
                        'ink-4': 'var(--c-text-4)',

                        /* —— 悬停加强 / 拖拽高亮 —— */
                        'hover-strong': 'var(--c-hover-strong)',
                        'drag':         'var(--c-drag)',

                        /* —— 文件类型图标 —— */
                        'icon-folder': 'var(--c-icon-folder)',
                        'icon-md':     'var(--c-icon-md)',
                        'icon-image':  'var(--c-icon-image)',
                        'icon-code':   'var(--c-icon-code)',

                        /* —— 强调色 —— */
                        accent:         'var(--c-accent)',
                        'accent-strong': 'var(--c-accent-strong)',
                        'accent-soft':   'var(--c-accent-soft)',
                        'accent-line':   'var(--c-accent-line)',
                        danger:         'var(--c-danger)',
                        'danger-strong': 'var(--c-danger-strong)',
                        'danger-soft':   'var(--c-danger-soft)',
                        success:        'var(--c-success)',
                        'success-soft':  'var(--c-success-soft)',
                        warn:           'var(--c-warn)',
                        'warn-strong':   'var(--c-warn-strong)',
                        'warn-soft':     'var(--c-warn-soft)',
                    }
                }
            },
            /* ================================================================
               [安全清单] 只出现在 tree-guest-browser.js 里的类名。
               Tailwind CDN 靠扫描 DOM 生成样式，而文件树是 fetch 完之后才
               x-html 塞进来的——扫描有延迟，首帧可能没样式。写死在这里，
               让它启动时就生成好。以后树里新增了颜色类名，记得同步加进来。
               ================================================================ */
            safelist: [
                'hover:bg-hover-strong', 'bg-drag',
                'text-icon-folder', 'text-icon-md', 'text-icon-image', 'text-icon-code',
                'group-hover:text-ink-3',
                'ring-line',
            ]
        }
    </script>

    <script>
        /* ================================================================
           [防闪烁] 必须在 body 渲染前同步执行，且不能加 defer。
           在样式生效前就把 data-theme 打到 <html> 上，
           否则夜间用户每次刷新都会先闪一下白底。
           想改默认主题：把下面的 fallback 改成 'light' 即可。
           ================================================================ */
        (function () {
            var saved = localStorage.getItem('notebook_theme');
            var theme = saved
                || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script defer src="/notebook/static/js/utils.js"></script>
    <script defer src="/notebook/static/js/tree-guest-browser.js"></script>
    <script defer src="/notebook/static/js/alpinejs-3.x.x-cdn.min.js"></script>

    <style>
        /* ========== 全局基础 ========== */
        [x-cloak] { display: none !important; }

        /* ---- 层级（与主题无关）---- */
        :root {
            --z-nav: 30;
            --z-context-menu: 70;
            --z-normal-modal: 80;
            --z-modal: 80;
            --z-history: 85;
            --z-modal-share: 85;
            --z-overlay: 120;
            --z-toast: 130;
        }

        /* ================================================================
           [调色板 · 日间]  ——保持你现在的观感，只是把硬编码换成变量
           ================================================================ */
        :root, [data-theme="light"] {
            /* 表面 */
            --c-canvas:      #f8f9fa;
            --c-surface:     #ffffff;
            --c-surface-2:   #f8f9fa;
            --c-surface-3:   #f1f3f5;
            --c-editor:      #ffffff;
            --c-hover:       #f1f3f5;
            --c-hover-strong: #e9ecef;   /* 已聚焦行再悬停，比普通悬停深一档 */
            --c-drag:        #93c5fd;    /* 拖拽：源节点 + 悬停目标 */
            --c-veil:        rgba(255, 255, 255, .85);
            --c-scrim:       rgba(0, 0, 0, .45);

            /* 文件类型图标（文件树） */
            --c-icon-folder: #f59e0b;
            --c-icon-md:     #60a5fa;
            --c-icon-image:  #f472b6;
            --c-icon-code:   #22c55e;

            /* 线条 */
            --c-border:      #e9ecef;
            --c-border-soft: #f1f3f5;

            /* 文字 */
            --c-text:        #212529;
            --c-text-2:      #495057;
            --c-text-3:      #868e96;
            --c-text-4:      #adb5bd;

            /* 强调色 */
            --c-accent:         #3b82f6;
            --c-accent-strong:  #2563eb;
            --c-accent-soft:    #eff6ff;
            --c-accent-line:    #bfdbfe;
            --c-danger:         #ef4444;
            --c-danger-strong:  #dc2626;
            --c-danger-soft:    #fef2f2;
            --c-success:        #10b981;
            --c-success-soft:   #ecfdf5;
            --c-warn:           #f59e0b;
            --c-warn-strong:    #d97706;
            --c-warn-soft:      #fffbeb;
            --c-on-accent:      #ffffff;   /* 强调色填充之上的文字色 */

            /* 编辑器细节 */
            --c-caret:          #212529;
            --c-selection:      rgba(77, 171, 247, .25);

            /* 滚动条 */
            --c-scrollbar:       #ced4da;
            --c-scrollbar-hover: #adb5bd;
        }

        /* ================================================================
           [调色板 · 夜间护眼]  夜半听风雨，挑灯书流年

           调这里时要记住四条（暗色不是"浅色的反色"）：
           1. 底色不用纯黑——#000 配白字会产生光晕(halation)，反而更累
           2. 正文不用纯白——浅灰比 #fff 舒服得多
           3. 整体压低对比度，"降一档"才是护眼的本质
           4. editor 略亮于 surface，让"灯"照在纸上，写作区成为视觉焦点
           ================================================================ */
        [data-theme="dark"] {
            /* 表面：微暖的中性深灰，不用冷蓝黑 */
            --c-canvas:      #191a1c;
            --c-surface:     #212326;
            --c-surface-2:   #1d1f21;
            --c-surface-3:   #2b2e33;
            --c-editor:      #35383d;   /* 比面板亮一档 */
            --c-hover:       #2f3338;
            --c-hover-strong: #3a4046;
            --c-drag:        rgba(91, 156, 248, .32);  /* 半透明比实色更贴合深底 */
            --c-veil:        rgba(33, 35, 38, .85);
            --c-scrim:       rgba(0, 0, 0, .65);   /* 暗背景下要更深才压得住 */

            /* 文件类型图标：夜间降饱和 + 提亮，避免变成一盏盏小彩灯 */
            --c-icon-folder: #dba63f;
            --c-icon-md:     #6ba7f5;
            --c-icon-image:  #e07fb0;
            --c-icon-code:   #52c47f;

            /* 线条 */
            --c-border:      #303031;
            --c-border-soft: #2b2e33;

            /* 文字 */
            --c-text:        #c9ccd1;
            --c-text-2:      #a8adb5;
            --c-text-3:      #9399a2;
            --c-text-4:      #767c85;

            /* 强调色：降饱和 + 提亮，避免夜里"闪光弹" */
            --c-accent:         #5b9cf8;
            --c-accent-strong:  #7cb0fa;
            --c-accent-soft:    rgba(91, 156, 248, .14);
            --c-accent-line:    rgba(91, 156, 248, .35);
            --c-danger:         #f07171;
            --c-danger-strong:  #f58a8a;
            --c-danger-soft:    rgba(240, 113, 113, .14);
            --c-success:        #34d399;
            --c-success-soft:   rgba(52, 211, 153, .14);
            --c-warn:           #fbbf24;
            --c-warn-strong:    #fcd34d;
            --c-warn-soft:      rgba(251, 191, 36, .14);
            --c-on-accent:      #14181e;   /* 亮色填充上必须用深色文字，否则对比度不够 */

            /* 编辑器细节 */
            --c-caret:          #e0b64a;             /* 暖黄光标，呼应"挑灯" */
            --c-selection:      rgba(224, 182, 74, .28);

            /* 滚动条 */
            --c-scrollbar:       #3a3f45;
            --c-scrollbar-hover: #4a5057;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--c-canvas);
            color: var(--c-text);
            overflow: hidden;
            height: 100vh;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-scrollbar-hover); }

        /* ========== 编辑器 ========== */
        textarea.editor, pre code {
            font-family:
                    'JetBrains Mono',
                    'Sarasa Mono SC',
                    'Noto Sans Mono CJK SC',
                    'Microsoft YaHei',
                    'PingFang SC',
                    monospace;
        }
        textarea.editor {
            font-size: 14px;
            line-height: 1.7;
            tab-size: 4;
        }

        /* ========== FM胶囊 ========== */
        .fm-capsule {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px; /* 胶囊形状 */
            font-size: 10px;
            font-weight: 600;
            color: white;
            transition: background-color 0.4s ease, box-shadow 0.4s ease; /* 关键：平滑过渡 */
            cursor: default;
            user-select: none;
        }

        /* 默认状态（代码图标，非胶囊） */
        .fm-default {
            color: var(--c-text-4);
            font-size: 10px;
        }

        /* 状态1: OK - 绿色 */
        .fm-ok {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 1px 3px rgba(34, 197, 94, 0.2);
        }

        /* 状态-1: Error - 黄色 */
        .fm-error {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            box-shadow: 0 1px 3px rgba(234, 179, 8, 0.2);
        }

        /* 移除之前的流光动画，因为我们不需要了 */
        .fm-capsule::before {
            display: none;
        }

        /* ========== 加载动画 ========== */
        .loading-spinner {
            width: 14px; height: 14px;
            border: 2px solid var(--c-surface-3);
            border-top-color: var(--c-accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 编辑器 · 主题细节 ==========
           暗色模式最容易漏的三个：光标、选区、placeholder
           光标尤其致命——不设 caret-color，它在深底上会变成黑光标，几乎看不见 */
        textarea.editor { caret-color: var(--c-caret); }
        textarea.editor::placeholder { color: var(--c-text-4); }
        textarea.editor::selection { background: var(--c-selection); color: inherit; }
        ::selection { background: var(--c-selection); }

        /* ========== FM 胶囊 · 夜间去饱和 ==========
           高饱和渐变填充在夜里就是两块刺眼的灯，改成"淡底 + 亮字" */
        [data-theme="dark"] .fm-ok {
            background: var(--c-success-soft);
            color: var(--c-success);
            box-shadow: none;
        }
        [data-theme="dark"] .fm-error {
            background: var(--c-warn-soft);
            color: var(--c-warn);
            box-shadow: none;
        }

        /* 强调色填充之上的文字：夜间把白字换成深色。
           亮绿/亮蓝填充配白字对比度不到 2:1，在夜里尤其糊。 */
        [data-theme="dark"] .text-white { color: var(--c-on-accent); }

        /* ========== 主题切换过渡 ==========
           只在切换那一瞬间挂到 <html> 上（见 applyTheme），260ms 后摘掉。
           常驻会给整个 DOM 加 transition，编辑大文件时明显拖慢响应。 */
        .theme-anim,
        .theme-anim *,
        .theme-anim *::before,
        .theme-anim *::after {
            transition: background-color .22s ease,
            border-color     .22s ease,
            color            .22s ease,
            box-shadow       .22s ease !important;
        }
    </style>
</head>
<body>

</nav>

<!-- ============================
     [MODAL] 关于弹窗
     ============================ -->
<template x-teleport="body">
    <div x-show="showAboutModal" x-cloak class="fixed inset-0 z-[var(--z-overlay)] overflow-y-auto">
        <!-- 遮罩 -->
        <div x-show="showAboutModal" x-transition class="fixed inset-0 bg-scrim backdrop-blur-sm" @click="closeAboutModal()"></div>

        <!-- 弹窗主体 -->
        <div class="flex min-h-full items-center justify-center p-4">
            <div x-show="showAboutModal" x-transition class="relative bg-surface rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden" @click.stop @keydown.escape="closeAboutModal()">
                <!-- 标题栏 -->
                <div class="flex items-center justify-between px-6 py-4 border-b border-line-soft">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-400 to-cyan-400 flex items-center justify-center">
                            <i class="fas fa-info-circle text-white w-4"></i>
                        </div>
                        <h3 class="text-lg font-bold text-ink">关于</h3>
                    </div>
                    <button @click="closeAboutModal()" class="p-2 rounded-lg text-ink-4 hover:bg-hover hover:text-ink-2 transition-colors">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- 内容区 -->
                <div class="p-6 space-y-5">
                    <!-- 基本信息 -->
                    <div class="flex flex-col items-center py-2">
                        <div class="w-14 h-14 mb-3 flex items-center justify-center">
                            <i class="fa-solid fa-scroll text-3xl"></i>
                        </div>
                        <div class="flex items-center justify-center">
                            <span class="font-bold text-ink text-sm tracking-wide">流年笺</span>
                        </div>
                    </div>
                    <!-- 开源信息 - 统一卡片样式和间距 -->
                    <div class="bg-surface2 rounded-xl p-4 border border-line-soft space-y-3">
                        <p class="text-sm text-ink-2 leading-relaxed">
                            这是一个开源、轻量但功能强大的云笔记本，支持文章分享、静态站点生成、底层存储分离。许可证范围内可自由修改、分发。
                        </p>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-ink-2">开源地址：</span>
                            <a href="https://github.com/cl-ei/notebook-liunianjian" target="_blank" rel="noopener noreferrer" class="text-sm text-accent hover:underline flex items-center">
                                GitHub 仓库
                                <i class="fas fa-external-link-alt ml-1 text-xs"></i>
                            </a>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-ink-2">许可证：</span>
                            <span class="text-sm text-ink-2">MIT License</span>
                        </div>
                    </div>
                    <div class="bg-surface2 rounded-xl p-4 border border-line-soft">

                                    class="w-full pl-10 pr-12 py-3 border border-line rounded-lg focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                                    placeholder="••••••••"
                            >
                            <button
                                    type="button"
                                    @click="showPassword = !showPassword"
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-ink-4 hover:text-ink-2"
                            >
                                <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                            </button>
                        </div>
                        <p class="text-xs text-ink-3 mt-1" x-show="loginMode === 'register'">
                            密码长度需在5-32个字符之间
                        </p>
                    </div>

                    <!-- 提交按钮 -->
                    <button
                            type="submit"
                            :disabled="authLoading || !loginForm.email || loginForm.password.length < 5"
                            class="w-full py-3 px-4 bg-accent hover:bg-accent-strong disabled:opacity-60 disabled:cursor-not-allowed text-white font-medium rounded-lg shadow-sm hover:shadow transition-all duration-150 flex items-center justify-center"
                    >
                        <span x-show="!authLoading" x-text="loginMode === 'login' ? '登录' : '注册'"></span>
                        <span x-show="authLoading" class="flex items-center">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            处理中...
                        </span>
                    </button>
                </form>

                <!-- 胶囊切换器 -->
                <div class="mt-8 flex justify-center">
                    <div class="relative bg-surface3 rounded-full p-1 flex items-center w-64 h-11">
                        <div
                                class="absolute top-1 bottom-1 w-1/2 bg-editor rounded-full shadow-sm transition-transform duration-300 ease-out"
                                :class="loginMode === 'login' ? 'left-1' : 'left-1/2'"
                        ></div>
                        <button
                                @click="toggleLoginMode()"
                                type="button"
                                class="relative z-10 flex-1 h-full flex items-center justify-center text-sm font-medium transition-colors duration-300"
                                :class="loginMode === 'login' ? 'text-accent' : 'text-ink-3 hover:text-ink-2'"
                        >
                            <i class="fas fa-sign-in-alt mr-1.5 text-xs"></i>
                            登录
                        </button>
                        <button
                                @click="toggleLoginMode()"
                                type="button"
                                class="relative z-10 flex-1 h-full flex items-center justify-center text-sm font-medium transition-colors duration-300"
                                :class="loginMode === 'register' ? 'text-accent' : 'text-ink-3 hover:text-ink-2'"
                        >
                            <i class="fas fa-user-plus mr-1.5 text-xs"></i>
                            注册
                        </button>
                    </div>
                </div>

                <!-- 私有部署说明 -->
                <div class="mt-6 p-4 bg-gradient-to-br from-surface2 to-accent-soft rounded-xl border border-line">
                    <div class="flex items-start space-x-3">
                        <div class="flex-shrink-0">
                            <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-400 to-cyan-400 flex items-center justify-center">
                                <i class="fas fa-lock text-white text-sm"></i>
                            </div>
                        </div>
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-ink">私有部署版本</h4>
                            <p class="text-xs text-ink-3 mt-1 leading-relaxed">
                                此站点为私有部署，仅限授权用户访问。<br>
                                想要拥有自己的笔记服务？
                            </p>
                            <a href="https://github.com/cl-ei/notebook-liunianjian"
                               target="_blank"
                               class="inline-flex items-center text-xs font-medium text-accent hover:text-accent-strong mt-2 transition-colors group">
                                <i class="fab fa-github mr-1.5"></i>
                                获取开源版本
                                <i class="fas fa-arrow-right ml-1 text-[10px] opacity-0 group-hover:opacity-100 transform group-hover:translate-x-0.5 transition-all"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
<!-- ============================
     [SCRIPT] 应用逻辑
     ============================ -->
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('guestApp', () => ({
            showAboutModal: false,
            showSearch: false,

            showLoginModal: false,
            loginMode: 'login', // 'login' | 'register'
            authLoading: false,
            showPassword: false,
            loginForm: { email: '', password: '' },

            // ---- [Theme] 'light' | 'dark' ----
            // 初值直接读 <html data-theme>，与 head 里的防闪烁脚本保持单一数据源
            theme: document.documentElement.getAttribute('data-theme') || 'light',
            _themeAnimTimer: null,

            toasts: [],
            toastIdCounter: 0,

            // ============================
            // 以下为预览逻辑
            // ============================
            fmBubbleOpen: false, // 控制FM气泡显示
            // ===== 基础状态 =====
            username: 'guest',
            domain: 'madliar.com',
            viewMode: 'split',
            sidebarCollapsed: false,
            currentFile: null,
            selectedNodeId: null,
            focusedNodeId: null,
            editorContent: '',
            previewReady: false,
            syncTimer: null,

            init() {
                // 应用主题（instant=true：首屏不要过渡动画）
                this.applyTheme(true);
                // 主题变化时重发一次预览，让 iframe 里的 render.html 跟上配色
                this.$watch('theme', () => this._doSyncPreview());

                window.addEventListener('message', (event) => {
                    if (event.data?.type === 'IFRAME_READY') {
                        this.previewReady = true;
                    }
                });

                document.addEventListener('keydown', (e) => {
                    // Ctrl+S 保存
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        this.showToast("登录以编辑文档", "info");
                    }
                });

                // 监听来自 iframe 的消息
                window.addEventListener('message', (event) => {
                    // 安全校验：只处理来自我们 iframe 的消息
                    if (event.source !== this.$refs.previewFrame?.contentWindow) return;
                    if (event.data.type === 'IFRAME_CLICK') {
                        this.closeAllPopups();
                    }
                });

                // 绑定内容变更事件，触发内容同步到 iframe
                // 因为 _doSyncPreview 涉及 FM 的解析，其结果会影响 FM icon,
                // 所以任何内容变更都应调用 _doSyncPreview
                // 在 _doSyncPreview 内部对视图进行判断，处理生成逻辑和 iframe 消息的发送
                const syncPreview = () => this._doSyncPreview();
                this.$watch('viewMode', syncPreview);
                this.$watch('editorContent', syncPreview);
                this.$watch('previewReady', ready => ready && syncPreview());
                this.$watch('currentFile', (newFile, oldFile) => {
                        if (newFile?.id !== oldFile?.id) syncPreview()
                    },
                    { deep: true }
                );
                // 编辑器键盘监听
                this.$nextTick(() => {
                    const editor = this.$refs.editor;
                    if (!editor) return;
                    editor.addEventListener('keydown', (e) => { nb_editorKeydownHandler(e, { editor: editor }); });
                });
            },

            navigateAway() { window.location.href = "/"; },
            openAboutModal() { this.showAboutModal = true; },
            closeAboutModal() { this.showAboutModal = false; },
            doSearch() { this.showToast('登录以使用搜索', 'info'); this.showSearch = false; },

            // ===== 登录/注册相关 =====
            toggleLoginMode() {
                this.loginMode = this.loginMode === 'login' ? 'register' : 'login';
                this.loginForm.password = '';
            },
            closeLoginModal() {
                this.showLoginModal = false;
                this.loginForm = { email: '', password: '' };
                this.authLoading = false;
            },
            async submitAuth() {
                if (this.authLoading) return;
                this.authLoading = true;

                try {
                    const url = this.loginMode === 'login' ? '/notebook/login' : '/notebook/register';
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm),
                        credentials: 'include'
                    });
                    const data = await res.json();

                    if (data.code === 0) {
                        localStorage.setItem('notebook_user_email', data.data.email);
                        this.showToast(this.loginMode === 'login' ? '登录成功！正在跳转...' : '注册成功！正在跳转...', 'success');
                        setTimeout(() => {
                            window.location.href = '/notebook'; // 跳转到主编辑页
                        }, 1200);
                    } else {
                        this.showToast(data.msg || '操作失败', 'error');
                        this.authLoading = false;
                    }
                } catch (e) {
                    this.showToast('网络错误，请检查连接', 'error');
                    this.authLoading = false;
                }
            },
            // ===== [UI] 通用提示、对话方法 =====
            closeAllPopups() {
                this.fmBubbleOpen = false;
                window.dispatchEvent(new Event('notebook:closeAllPopups'));
            },
            showOverlay(message = '正在处理...') { this.overlay = { show: true, message }; },
            hideOverlay() { this.overlay.show = false; },
            showToast(message, type = 'info') {
                const id = ++this.toastIdCounter;
                this.toasts.push({ id, message, type, show: true });

                setTimeout(() => {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.show = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }, 2500);
            },

            // ===== 初始化 =====
            async notebook__openFile(path) {
                const filename = path.replace(/\\/g, '/').split(/[?#]/)[0].split('/').pop() || '';
                this.currentFile = { id: path, base: null, version: null, baseContent: '', fmStatus: null, fmLog: null }

                if (isTextType(filename)) {
                    // ---- 文本类：调 /notebook/open 接口 ----
                    try {
                        const res = await fetch('/notebook/open', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filepath: path, version: null }),
                            credentials: 'include',
                        });
                        const resp = await res.json();
                        if (resp.code !== 0) throw new Error(resp.msg || '打开失败');

                        const { version, base, base_content, diff } = resp.data;
                        const fullContent = mergeContent(base_content, diff);

                        this.editorContent = fullContent;
                        this.lastSavedContent = fullContent;

                        // 记录版本锚点
                        this.currentFile.base = base;
                        this.currentFile.version = version;
                        this.currentFile.baseContent = base_content;
                    } catch (e) {
                        this.editorContent = `# 加载失败\n\n无法读取文件内容: ${filename}\n\n> 错误: ${e.message}`;
                        this.lastSavedContent = this.editorContent;
                        this.currentFile.base = null;
                        this.currentFile.version = null;
                        this.currentFile.baseContent = '';
                    }
                } else if (isImageType(filename)) {
                    // ---- 图片类 ----
                    this.editorContent = `![](${filename})`;
                    this.lastSavedContent = this.editorContent;
                } else {
                    // ---- 其他文件 ----
                    const encodedPath = encodeURIComponent(path);
                    this.editorContent = `<a href="/notebook/raw_file?path=${encodedPath}" target="_blank">📎 点击下载/打开文件：${filename}</a>`;
                    this.lastSavedContent = this.editorContent;
                }
            },
            notebook__closeFile() {
                // 强制关闭文档
                this.currentFile = null;
                this.editorContent = '';
                this.lastSavedContent = '';
                this.lastCommitMd5 = '';
                this.isSaving = false;
                this.fmBubbleOpen = false;
            },
            closeCurrentFileAndDeselect() {
                // 1. 清空编辑框、关闭当前文件
                this.notebook__closeFile();
                window.dispatchEvent(new Event('notebook:closeFile'));
            },
            _doSyncPreview() {
                if (this.syncTimer) clearTimeout(this.syncTimer);
                this.syncTimer = setTimeout(() => {
                    let contentToSend = '';
                    try {
                        const filepath = this.currentFile?.id || '';
                        let pureInput = this.editorContent;

                        if (isMarkdownType(filepath)) {
                            // Markdown 文件：直接渲染
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 更新 FM 状态
                            if (this.currentFile) {
                                this.currentFile.fmStatus = rendered.status;
                                this.currentFile.fmLog = rendered.log;
                            }
                        } else if (isCodeType(filepath)) {
                            // 代码文件：包成 Markdown 代码块，复用渲染管线
                            const lang = getCodeLang(filepath);
                            // 处理代码内容里的反引号：如果内容里有连续3个反引号，用4个反引号包裹避免语法冲突
                            const fenceLen = Math.max(3, (pureInput.match(/`+/g) || []).reduce((max, m) => Math.max(max, m.length), 0) + 1);
                            const fence = '`'.repeat(fenceLen);
                            // 转义内容里的反斜杠（避免 Markdown 转义问题）
                            const escapedContent = pureInput.replace(/\\/g, '\\\\');
                            // 拼接成 Markdown 代码块
                            pureInput = `${fence}${lang}\n${escapedContent}\n${fence}`;
                            // 交给 Markdown 渲染，自动触发代码高亮
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 代码文件不需要 FM 校验
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else if (isPlainTextType(filepath)) {
                            // 纯文本文件：用原来的样式包裹
                            pureInput = `<div class="plain-text-preview">${escapeHtml(this.editorContent)}</div>`;
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else  if (isImageType(filepath)) {
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else {
                            // 其他类型（图片/二进制等）：保持原有逻辑
                            contentToSend = `<div class="text-ink-3 p-4">不支持预览的文件类型</div>`;
                        }
                    } catch (e) {
                        contentToSend = `<div class="text-danger p-4">渲染失败: ${escapeHtml(e.message)}</div>`;
                    }

                    if (!this.previewReady) return;
                    const iframe = document.querySelector('iframe[x-ref="previewFrame"]');
                    if (!iframe?.contentWindow) {
                        console.warn('预览iframe未就绪，跳过同步');
                        return;
                    }
                    iframe.contentWindow.postMessage({
                        type: 'SYNC_CONTENT',
                        html: contentToSend,
                        path: this.currentFile?.id || '',
                        username: this.username,
                        domain: this.domain,
                        theme: this.theme,   // 供 render.html 同步配色
                    }, '*');
                }, 300);
            },
            // ============================
            // [Theme] 主题切换
            // ============================
            applyTheme(instant) {
                const root = document.documentElement;
                if (!instant) {
                    // 过渡只在切换瞬间挂上，260ms 后摘掉（常驻会拖慢大 DOM）
                    root.classList.add('theme-anim');
                    clearTimeout(this._themeAnimTimer);
                    this._themeAnimTimer = setTimeout(() => root.classList.remove('theme-anim'), 260);
                }
                root.setAttribute('data-theme', this.theme);
                localStorage.setItem('notebook_theme', this.theme);
            },
            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                this.applyTheme();
            },

            // ============================
            // [Editor] 编辑框方法
            // ============================
            formatPath(path, maxLen = 45) {
                if (!path) return '';
                if (path.length <= maxLen) return path;
                const half = Math.floor((maxLen - 3) / 2);
                return path.substring(0, half) + '...' + path.substring(path.length - half);
            },
            copyPath() {
                if (this.currentFile?.id) {
                    navigator.clipboard.writeText(this.currentFile.id).then(() => {
                        this.showToast('路径已复制到剪贴板', 'success');
                    }).catch(() => {
                        this.showToast('复制失败', 'error');
                    });
                }
            },
            // ===== 游客操作拦截 =====
            handleGuestAction(action) {
                this.showToast('未登录，无法执行此操作', 'info');
                this.closeContextMenu();
            },
        }));
    });
</script>
