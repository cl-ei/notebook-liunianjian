<!DOCTYPE html>
<html lang="zh-CN" x-data="guestApp()" x-cloak>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流年笺 - 游客预览</title>

    <link rel="stylesheet" href="/notebook/static/font-awesome-6-4-0/css/all.min.css">
    <link rel="stylesheet" href="/notebook/static/fonts/fonts.css">

    <script src="/notebook/static/js/marked-18.0.5.js"></script>
    <script src="/notebook/static/js/diff_match_patch.js"></script>
    <script src="/notebook/static/js/spark-md5.min.js"></script>
    <script src="/notebook/static/js/purify-3.1.6.min.js"></script>
    <script src="/notebook/static/js/tailwindcss-3.4.17.js"></script>

    <script defer src="/notebook/static/js/utils.js"></script>
    <script defer src="/notebook/static/js/tree-guest-browser.js"></script>
    <script defer src="/notebook/static/js/alpinejs-3.x.x-cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        :root {
            --z-nav: 30;
            --z-context-menu: 70;
            --z-normal-modal: 80;
            --z-modal: 80;
            --z-overlay: 120;
            --z-toast: 130;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            overflow: hidden;
            height: 100vh;
        }

        /* ========== 滚动条 ========== */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ced4da; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #adb5bd; }

        /* ========== 编辑器 ========== */
        textarea.editor, pre code {
            font-family:
                    'JetBrains Mono',
                    'Sarasa Mono SC',
                    'Noto Sans Mono CJK SC',
                    'Microsoft YaHei',
                    'PingFang SC',
                    monospace;
        }
        textarea.editor {
            font-size: 14px;
            line-height: 1.7;
            tab-size: 4;
        }

        /* ========== FM胶囊 ========== */
        .fm-capsule {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px; /* 胶囊形状 */
            font-size: 10px;
            font-weight: 600;
            color: white;
            transition: background-color 0.4s ease, box-shadow 0.4s ease; /* 关键：平滑过渡 */
            cursor: default;
            user-select: none;
        }

        /* 默认状态（代码图标，非胶囊） */
        .fm-default {
            color: #9ca3af; /* gray-400 */
            font-size: 10px;
        }

        /* 状态1: OK - 绿色 */
        .fm-ok {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 1px 3px rgba(34, 197, 94, 0.2);
        }

        /* 状态-1: Error - 黄色 */
        .fm-error {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            box-shadow: 0 1px 3px rgba(234, 179, 8, 0.2);
        }

        /* 移除之前的流光动画，因为我们不需要了 */
        .fm-capsule::before {
            display: none;
        }

        /* ========== 加载动画 ========== */
        .loading-spinner {
            width: 14px; height: 14px;
            border: 2px solid #e9ecef;
            border-top-color: #4dabf7;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- ============================
     [NAV] 顶部导航栏
     ============================ -->
<nav class="h-14 bg-white border-b border-gray-200 flex items-center justify-center px-4 flex-shrink-0 shadow-sm relative z-[var(--z-nav)]">
    <div class="absolute left-4 flex items-center space-x-1">
        <a href="#" @click.prevent="navigateAway()" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-150" title="返回主页">
            <i class="fas fa-home text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">主页</span>
        </a>
        <div class="h-6 w-px bg-gray-200 mx-1"></div>
        <button :disabled=true class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed" title="保存 (Ctrl+S)">
            <i class="fas fa-save text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">保存</span>
        </button>
        <button :disabled=true class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed" title="历史版本">
            <i class="fas fa-history text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">历史</span>
        </button>
        <button @click="openAboutModal()" type="button" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed" title="关于">
            <i class="fas fa-info-circle text-sm"></i>
            <span class="text-sm font-medium hidden sm:inline">关于</span>
        </button>
    </div>

    <div class="flex items-center justify-center">
        <span class="font-bold text-gray-800 text-sm tracking-wide">流年笺</span>
        <span class="ml-3 px-2 py-0.5 bg-amber-100 text-amber-700 text-[10px] font-bold rounded-full uppercase tracking-wider">游客模式</span>
    </div>

    <div class="absolute right-4 flex items-center space-x-4">
        <button @click="showSearch = !showSearch" class="p-2 rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition-all duration-150" title="搜索 (Ctrl+K)">
            <i class="fas fa-search text-sm"></i>
        </button>
        <div class="flex items-center bg-gray-100 rounded-lg p-0.5 ml-1 mr-4">
            <button @click="viewMode = 'single'" :class="viewMode === 'single' ? 'bg-white text-blue-500 shadow-sm' : 'text-gray-400 hover:text-gray-600'" class="px-2.5 py-1.5 rounded-md text-xs transition-all duration-150" title="单页视图">
                <i class="fas fa-window-maximize"></i>
            </button>
            <button @click="viewMode = 'split'" :class="viewMode === 'split' ? 'bg-white text-blue-500 shadow-sm' : 'text-gray-400 hover:text-gray-600'" class="px-2.5 py-1.5 rounded-md text-xs transition-all duration-150" title="双页视图">
                <i class="fas fa-columns"></i>
            </button>
        </div>
        <div class="h-6 w-px bg-gray-200"></div>
        <div class="relative items-center">
            <button @click="showLoginModal = true" type="button" class="flex items-center space-x-2 px-2.5 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-600 text-white transition-all duration-150 disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fas fa-sign-in-alt"></i>
                <span class="text-sm font-medium hidden sm:inline">登录/注册</span>
            </button>
        </div>
    </div>
</nav>

<!-- ============================
     [MODAL] 关于弹窗
     ============================ -->

                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">开源地址：</span>
                            <a href="https://github.com/cl-ei/notebook-liunianjian" target="_blank" rel="noopener noreferrer" class="text-sm text-blue-500 hover:underline flex items-center">
                                GitHub 仓库
                                <i class="fas fa-external-link-alt ml-1 text-xs"></i>
                            </a>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-600">许可证：</span>
                            <span class="text-sm text-gray-700">MIT License</span>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                        <h5 class="text-sm font-medium text-center text-gray-700 mb-3">核心技术栈</h5>
                        <div class="flex flex-wrap gap-2">
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">
                                <i class="fa-brands fa-python mr-1.5"></i>Python 3.13+
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">
                                <i class="fa-solid fa-bolt mr-1.5"></i>FastAPI
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">
                                <i class="fa-solid fa-mountain mr-1.5"></i>Alpine.js
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">
                                <i class="fa-solid fa-wind mr-1.5"></i>Tailwind CSS
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">
                                <i class="fa-solid fa-code mr-1.5"></i>Marked.js
                            </span>
                            <span class="inline-flex items-center px-2.5 py-1 bg-gray-100 text-gray-700 text-xs rounded-full border border-gray-200">

                                <i class="fa-brands fa-font-awesome mr-1.5"></i>Font Awesome
                            </span>
                        </div>
                    </div>
                    <!-- ============================
                         字体致谢模块 - 统一卡片样式
                         ============================ -->
                    <section class="about-section">
                        <div x-data="{ fontOpen: false }" class="border border-gray-100 rounded-xl overflow-hidden bg-white">
                            <!-- 头部：可点击展开/收起 -->
                            <button

                                    class="w-full flex items-center justify-between p-4 hover:bg-gray-50 transition-colors"

                                <div class="flex items-center space-x-3">
                                    <i class="fas fa-font text-blue-500"></i>

                            </button>

                            <!-- 展开内容 -->
                            <div x-show="fontOpen" x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0 h-0" x-transition:enter-end="opacity-100 h-auto" x-transition:leave="transition ease-in duration-100" x-transition:leave-start="opacity-100 h-auto" x-transition:leave-end="opacity-0 h-0" class="border-t border-gray-100">

                                            </div>
                                            <div class="text-sm" style="font-family: 'Inter', sans-serif; font-weight: 400;">

                                        <!-- 3. JetBrains Mono（代码等宽） -->

                                                <div class="flex items-center space-x-2">
                                                    <span class="font-medium text-gray-800" style="font-family: 'JetBrains Mono', monospace;">JetBrains Mono</span>
                                                    <span class="px-2 py-0.5 bg-purple-100 text-purple-700 text-xs rounded-full">代码等宽</span>
                                                </div>
                                                <span class="text-xs text-gray-500">400/500</span>
                                            </div>
                                            <div class="text-sm" style="font-family: 'JetBrains Mono', monospace; font-weight: 400;">
                                                <span class="text-gray-500">// Front Matter 示例</span><br>
                                                ---<br>
                                                title: "字体说明"<br>
                                                date: 2026-07-12<br>
                                                tags: [Inter, JetBrains Mono]
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 版权信息 - 调整间距和样式 -->
                    <div class="pt-2">
                        <p class="text-xs text-gray-400 text-center"
                           x-init="this.aboutYear = new Date().getFullYear()"
                           x-text="`© ${aboutYear} 流年笺 · 保留所有权利`">
                        </p>
                    </div>
                </div>

                <!-- 底部按钮 -->
                <div class="px-6 py-4 border-t border-gray-100 flex justify-center">
                    <button @click="closeAboutModal()" class="px-6 py-2.5 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium rounded-lg transition-colors">
                        我知道了
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- ============================
     [MODAL] 搜索弹窗
     ============================ -->
<template x-teleport="body">
    <div x-show="showSearch" x-cloak @keydown.escape.window="showSearch = false" class="fixed inset-0 z-[var(--z-normal-modal)] overflow-y-auto">
        <div class="fixed inset-0 bg-gray-900/30 backdrop-blur-sm" @click="showSearch = false"></div>
        <div class="flex min-h-full items-start justify-center pt-24 p-4">
            <div x-show="showSearch" x-transition class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100" @click.stop>
                <div class="flex items-center border-b border-gray-100 px-4">
                    <i class="fas fa-search text-gray-300"></i>
                    <input type="text" placeholder="搜索笔记... (Ctrl+K)" class="w-full bg-transparent border-none text-gray-800 px-3 py-4 focus:outline-none text-sm placeholder-gray-300" x-ref="searchInput" @keydown.enter="doSearch()">
                    <kbd class="hidden sm:inline-flex items-center px-2 py-1 bg-gray-100 rounded text-[10px] text-gray-400 font-mono">ESC</kbd>
                </div>
                <div class="p-2 max-h-64 overflow-y-auto">
                    <div class="px-3 py-1.5 text-[11px] text-gray-400 font-bold uppercase tracking-wider">最近搜索</div>
                    <div class="px-3 py-2 hover:bg-blue-50 rounded-lg cursor-pointer text-sm text-gray-700 transition-colors flex items-center">
                        <i class="fas fa-clock text-gray-300 mr-2 text-xs"></i>API 设计文档
                    </div>
                    <div class="px-3 py-2 hover:bg-blue-50 rounded-lg cursor-pointer text-sm text-gray-700 transition-colors flex items-center">
                        <i class="fas fa-clock text-gray-300 mr-2 text-xs"></i>项目会议纪要
                    </div>
                    <div class="px-3 py-2 hover:bg-blue-50 rounded-lg cursor-pointer text-sm text-gray-700 transition-colors flex items-center">
                        <i class="fas fa-clock text-gray-300 mr-2 text-xs"></i>Go 并发编程笔记
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- ============================
     [LAYOUT] 主内容区
     ============================ -->
<div class="flex" style="height: calc(100vh - 3.5rem);">
    <aside
            x-show="!sidebarCollapsed"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="-translate-x-full opacity-0"
            x-transition:enter-end="translate-x-0 opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="translate-x-0 opacity-100"
            x-transition:leave-end="-translate-x-full opacity-0"
            class="w-64 bg-white border-r border-gray-200 flex-shrink-0 overflow-hidden flex flex-col absolute md:relative z-20 h-full"
    >
        <div class="h-11 p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50">
            <h3 class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">游客的文件夹</h3>
        </div>
        <div x-data="treeBrowser()" class="h-full">
            <div class="overflow-auto flex-1 p-2 h-full" @click="onTreeClick" @contextmenu.prevent="onTreeRightClick" x-html="treeHtml"></div>
            <template x-teleport="body">
                <div
                        x-show="contextMenu.show"
                        x-cloak
                        @click.away="closeContextMenu()"
                        @contextmenu.prevent="closeContextMenu()"
                        x-transition:enter="transition ease-out duration-100"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        x-transition:leave="transition ease-in duration-75"
                        x-transition:leave-start="opacity-100 scale-100"
                        x-transition:leave-end="opacity-0 scale-95"
                        class="fixed z-[var(--z-context-menu)] min-w-[180px] bg-white rounded-xl shadow-2xl border border-gray-100 py-1 overflow-hidden"
                        :style="`left: ${contextMenu.x}px; top: ${contextMenu.y}px;`"
                >
                    <div x-show="contextMenu.targetNode" class="px-3 py-2 border-b border-gray-50 bg-gray-50/50">
                        <p class="text-xs text-gray-400 truncate" x-text="contextMenu.targetNode?.name || ''"></p>
                    </div>
                    <template x-for="(item, index) in contextMenu.items" :key="index">
                        <div>
                            <div x-show="item.divider" class="my-1 border-t border-gray-100"></div>
                            <button
                                    x-show="!item.divider"
                                    @click="executeContextAction(item.action)"
                                    class="w-full text-left px-3 py-2.5 text-sm flex items-center space-x-2 transition-colors"
                                    :class="{
                                'text-gray-700 hover:bg-blue-50 hover:text-blue-600': !item.danger && !item.highlight,
                                'text-red-500 hover:bg-red-50': item.danger,
                                'text-blue-600 bg-blue-50 font-medium': item.highlight,
                                'hover:bg-gray-50': !item.danger && !item.highlight
                            }"
                            >
                                <span x-text="item.label"></span>
                            </button>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </aside>

    <button
            @click="sidebarCollapsed = !sidebarCollapsed"
            class="absolute left-0 top-1/2 -translate-y-1/2 z-30 transition-all duration-300"
            :class="sidebarCollapsed ? 'ml-0' : 'ml-64'"
    >
        <div class="bg-white border border-gray-200 rounded-r-lg p-1 text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-all shadow-sm">
            <i :class="sidebarCollapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-left'" class="text-xs"></i>
        </div>
    </button>

    <!-- ============================
         [LAYOUT] 主编辑区（单/双页共用 · 无动画）
         ============================ -->
    <main class="flex-1 overflow-hidden bg-gray-50 flex flex-col">
        <div class="flex h-full">
            <!-- =======================
                 编辑区（永远存在）
                 ======================= -->
            <div class="flex flex-col min-w-0 h-full"
                 :class="viewMode === 'single' ? 'w-full' : 'w-1/2'">
                <div class="h-11 bg-white border-b border-gray-200 flex items-center px-4 shadow-sm">
                    <template x-if="currentFile">
                        <div class="flex items-center h-5 relative group">
                            <!-- MD 文件：动态胶囊 -->
                            <i x-show="isMarkdownType(currentFile.id) && currentFile.fmStatus === null"
                               class="fas fa-code text-gray-400 text-[10px] pointer-events-none select-none"
                            ></i>
                            <div
                                    x-show="isMarkdownType(currentFile.id) && (currentFile.fmStatus === 1 || currentFile.fmStatus === -1)"
                                    @click.stop="fmBubbleOpen = !fmBubbleOpen"
                                    :class="{

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('guestApp', () => ({
            showAboutModal: false,
            showSearch: false,

            showLoginModal: false,
            loginMode: 'login', // 'login' | 'register'
            authLoading: false,
            showPassword: false,
            loginForm: { email: '', password: '' },

            toasts: [],
            toastIdCounter: 0,

            // ============================
            // 以下为预览逻辑
            // ============================
            fmBubbleOpen: false, // 控制FM气泡显示
            // ===== 基础状态 =====
            username: 'guest',
            domain: 'madliar.com',
            viewMode: 'split',
            sidebarCollapsed: false,
            currentFile: null,
            selectedNodeId: null,
            focusedNodeId: null,
            editorContent: '',
            previewReady: false,
            syncTimer: null,

            init() {
                window.addEventListener('message', (event) => {
                    if (event.data?.type === 'IFRAME_READY') {
                        this.previewReady = true;
                    }
                });

                document.addEventListener('keydown', (e) => {
                    // Ctrl+S 保存
                    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                        e.preventDefault();
                        this.showToast("登录以编辑文档", "info");
                    }
                });

                // 监听来自 iframe 的消息
                window.addEventListener('message', (event) => {
                    // 安全校验：只处理来自我们 iframe 的消息
                    if (event.source !== this.$refs.previewFrame?.contentWindow) return;
                    if (event.data.type === 'IFRAME_CLICK') {
                        this.closeAllPopups();
                    }
                });

                // 绑定内容变更事件，触发内容同步到 iframe
                // 因为 _doSyncPreview 涉及 FM 的解析，其结果会影响 FM icon,
                // 所以任何内容变更都应调用 _doSyncPreview
                // 在 _doSyncPreview 内部对视图进行判断，处理生成逻辑和 iframe 消息的发送
                const syncPreview = () => this._doSyncPreview();
                this.$watch('viewMode', syncPreview);
                this.$watch('editorContent', syncPreview);
                this.$watch('previewReady', ready => ready && syncPreview());
                this.$watch('currentFile', (newFile, oldFile) => {
                        if (newFile?.id !== oldFile?.id) syncPreview()
                    },
                    { deep: true }
                );
                // 编辑器键盘监听
                this.$nextTick(() => {
                    const editor = this.$refs.editor;
                    if (!editor) return;
                    editor.addEventListener('keydown', (e) => { nb_editorKeydownHandler(e, { editor: editor }); });
                });
            },

            navigateAway() { window.location.href = "/"; },
            openAboutModal() { this.showAboutModal = true; },
            closeAboutModal() { this.showAboutModal = false; },
            doSearch() { this.showToast('登录以使用搜索', 'info'); this.showSearch = false; },

            // ===== 登录/注册相关 =====
            toggleLoginMode() {
                this.loginMode = this.loginMode === 'login' ? 'register' : 'login';
                this.loginForm.password = '';
            },
            closeLoginModal() {
                this.showLoginModal = false;
                this.loginForm = { email: '', password: '' };
                this.authLoading = false;
            },
            async submitAuth() {
                if (this.authLoading) return;
                this.authLoading = true;

                try {
                    const url = this.loginMode === 'login' ? '/notebook/login' : '/notebook/register';
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.loginForm),
                        credentials: 'include'
                    });
                    const data = await res.json();

                    if (data.code === 0) {
                        localStorage.setItem('notebook_user_email', data.data.email);
                        this.showToast(this.loginMode === 'login' ? '登录成功！正在跳转...' : '注册成功！正在跳转...', 'success');
                        setTimeout(() => {
                            window.location.href = '/notebook'; // 跳转到主编辑页
                        }, 1200);
                    } else {
                        this.showToast(data.msg || '操作失败', 'error');
                        this.authLoading = false;
                    }
                } catch (e) {
                    this.showToast('网络错误，请检查连接', 'error');
                    this.authLoading = false;
                }
            },
            // ===== [UI] 通用提示、对话方法 =====
            closeAllPopups() {
                this.fmBubbleOpen = false;
                window.dispatchEvent(new Event('notebook:closeAllPopups'));
            },
            showOverlay(message = '正在处理...') { this.overlay = { show: true, message }; },
            hideOverlay() { this.overlay.show = false; },
            showToast(message, type = 'info') {
                const id = ++this.toastIdCounter;
                this.toasts.push({ id, message, type, show: true });

                setTimeout(() => {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) {
                        toast.show = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }
                }, 2500);
            },

            // ===== 初始化 =====
            async notebook__openFile(path) {
                const filename = path.replace(/\\/g, '/').split(/[?#]/)[0].split('/').pop() || '';
                this.currentFile = { id: path, base: null, version: null, baseContent: '', fmStatus: null, fmLog: null }

                if (isTextType(filename)) {
                    // ---- 文本类：调 /notebook/open 接口 ----
                    try {
                        const res = await fetch('/notebook/open', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filepath: path, version: null }),
                            credentials: 'include',
                        });
                        const resp = await res.json();
                        if (resp.code !== 0) throw new Error(resp.msg || '打开失败');

                        const { version, base, base_content, diff } = resp.data;
                        const fullContent = mergeContent(base_content, diff);

                        this.editorContent = fullContent;
                        this.lastSavedContent = fullContent;

                        // 记录版本锚点
                        this.currentFile.base = base;
                        this.currentFile.version = version;
                        this.currentFile.baseContent = base_content;
                    } catch (e) {
                        this.editorContent = `# 加载失败\n\n无法读取文件内容: ${filename}\n\n> 错误: ${e.message}`;
                        this.lastSavedContent = this.editorContent;
                        this.currentFile.base = null;
                        this.currentFile.version = null;
                        this.currentFile.baseContent = '';
                    }
                } else if (isImageType(filename)) {
                    // ---- 图片类 ----
                    this.editorContent = `![](${filename})`;
                    this.lastSavedContent = this.editorContent;
                } else {
                    // ---- 其他文件 ----
                    const encodedPath = encodeURIComponent(path);
                    this.editorContent = `<a href="/notebook/raw_file?path=${encodedPath}" target="_blank">📎 点击下载/打开文件：${filename}</a>`;
                    this.lastSavedContent = this.editorContent;
                }
            },
            notebook__closeFile() {
                // 强制关闭文档
                this.currentFile = null;
                this.editorContent = '';
                this.lastSavedContent = '';
                this.lastCommitMd5 = '';
                this.isSaving = false;
                this.fmBubbleOpen = false;
            },
            closeCurrentFileAndDeselect() {
                // 1. 清空编辑框、关闭当前文件
                this.notebook__closeFile();
                window.dispatchEvent(new Event('notebook:closeFile'));
            },
            _doSyncPreview() {
                if (this.syncTimer) clearTimeout(this.syncTimer);
                this.syncTimer = setTimeout(() => {
                    let contentToSend = '';
                    try {
                        const filepath = this.currentFile?.id || '';
                        let pureInput = this.editorContent;

                        if (isMarkdownType(filepath)) {
                            // Markdown 文件：直接渲染
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 更新 FM 状态
                            if (this.currentFile) {
                                this.currentFile.fmStatus = rendered.status;
                                this.currentFile.fmLog = rendered.log;
                            }
                        } else if (isCodeType(filepath)) {
                            // 代码文件：包成 Markdown 代码块，复用渲染管线
                            const lang = getCodeLang(filepath);
                            // 处理代码内容里的反引号：如果内容里有连续3个反引号，用4个反引号包裹避免语法冲突
                            const fenceLen = Math.max(3, (pureInput.match(/`+/g) || []).reduce((max, m) => Math.max(max, m.length), 0) + 1);
                            const fence = '`'.repeat(fenceLen);
                            // 转义内容里的反斜杠（避免 Markdown 转义问题）
                            const escapedContent = pureInput.replace(/\\/g, '\\\\');
                            // 拼接成 Markdown 代码块
                            pureInput = `${fence}${lang}\n${escapedContent}\n${fence}`;
                            // 交给 Markdown 渲染，自动触发代码高亮
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            // 代码文件不需要 FM 校验
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else if (isPlainTextType(filepath)) {
                            // 纯文本文件：用原来的样式包裹
                            pureInput = `<div class="plain-text-preview">${escapeHtml(this.editorContent)}</div>`;
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else  if (isImageType(filepath)) {
                            const rendered = renderMarkdown(pureInput, filepath, this.username, this.domain);
                            contentToSend = rendered.html;
                            if (this.currentFile) {
                                this.currentFile.fmStatus = null;
                                this.currentFile.fmLog = '';
                            }
                        } else {
                            // 其他类型（图片/二进制等）：保持原有逻辑
                            contentToSend = `<div class="text-gray-500 p-4">不支持预览的文件类型</div>`;
                        }
                    } catch (e) {
                        contentToSend = `<div class="text-red-500 p-4">渲染失败: ${escapeHtml(e.message)}</div>`;
                    }

                    if (!this.previewReady) return;
                    const iframe = document.querySelector('iframe[x-ref="previewFrame"]');
                    if (!iframe?.contentWindow) {
                        console.warn('预览iframe未就绪，跳过同步');
                        return;
                    }
                    iframe.contentWindow.postMessage({
                        type: 'SYNC_CONTENT',
                        html: contentToSend,
                        path: this.currentFile?.id || '',
                        username: this.username,
                        domain: this.domain,
                    }, '*');
                }, 300);
            },
            // ============================
            // [Editor] 编辑框方法
            // ============================
            formatPath(path, maxLen = 45) {
                if (!path) return '';
                if (path.length <= maxLen) return path;
                const half = Math.floor((maxLen - 3) / 2);
                return path.substring(0, half) + '...' + path.substring(path.length - half);
            },
            copyPath() {
                if (this.currentFile?.id) {
                    navigator.clipboard.writeText(this.currentFile.id).then(() => {
                        this.showToast('路径已复制到剪贴板', 'success');
                    }).catch(() => {
                        this.showToast('复制失败', 'error');
                    });
                }
            },
            // ===== 游客操作拦截 =====
            handleGuestAction(action) {
                this.showToast('未登录，无法执行此操作', 'info');
                this.closeContextMenu();
            },
        }));
    });
</script>
